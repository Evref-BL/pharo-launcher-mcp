name: Publish to npm

on:
  push:
    branches: [main]
    paths:
      - package.json
      - package-lock.json
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish package
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: npm-publish
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.12.0
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Set up npm for trusted publishing
        run: |
          npm install -g npm@^11.5.1
          npm --version

      - name: Read package metadata
        id: package
        run: |
          echo "name=$(node -p "require('./package.json').name")" >> "$GITHUB_OUTPUT"
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Check package version is not published
        id: version
        run: |
          if npm view "${{ steps.package.outputs.name }}@${{ steps.package.outputs.version }}" version --json > /tmp/npm-version.json 2>/dev/null; then
            echo "::notice::${{ steps.package.outputs.name }}@${{ steps.package.outputs.version }} is already published; skipping publish"
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      # Releases are the automation's, never github-actions[bot]'s: without
      # its credentials nothing is published.
      - name: Require the automation credentials
        if: steps.version.outputs.published != 'true'
        env:
          APP_ID: ${{ secrets.DEVNEXUS_AUTOMATION_APP_ID }}
          PRIVATE_KEY: ${{ secrets.DEVNEXUS_AUTOMATION_PRIVATE_KEY }}
        run: |
          if [ -z "$APP_ID" ] || [ -z "$PRIVATE_KEY" ]; then
            echo "::error::DEVNEXUS_AUTOMATION_APP_ID and DEVNEXUS_AUTOMATION_PRIVATE_KEY must be set: a release is the automation's."
            exit 1
          fi

      - name: Install dependencies
        if: steps.version.outputs.published != 'true'
        run: npm ci

      - name: Run checks
        if: steps.version.outputs.published != 'true'
        run: npm run check

      - name: Verify package contents
        if: steps.version.outputs.published != 'true'
        run: npm pack --dry-run

      - name: Publish to npm
        if: steps.version.outputs.published != 'true'
        run: npm publish --access public --tag latest

      - uses: actions/create-github-app-token@v2
        id: app-token
        if: steps.version.outputs.published != 'true'
        with:
          app-id: ${{ secrets.DEVNEXUS_AUTOMATION_APP_ID }}
          private-key: ${{ secrets.DEVNEXUS_AUTOMATION_PRIVATE_KEY }}
          owner: Evref-BL
          repositories: |
            pharo-launcher-mcp
            PLexus

      # Every other repository in this stack leaves a tagged GitHub release
      # behind for each published version; this one published quietly. The tag
      # is cut here rather than by hand, so it always names the commit that was
      # actually published.
      - name: Create the GitHub release
        if: steps.version.outputs.published != 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TAG: v${{ steps.package.outputs.version }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::notice::$TAG already exists, leaving it alone"
            exit 0
          fi

          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --generate-notes

      # PLexus pins this package exactly, so a release reaches nobody until
      # that pin moves. Tell it, the way MCP and PLexus tell their own
      # consumers, instead of leaving one pin in the stack to be hand-edited.
      - name: Notify released consumers
        if: steps.version.outputs.published != 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          VERSION: ${{ steps.package.outputs.version }}
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          jq -nc --arg version "$VERSION" '{event_type: "component-release", client_payload: {component: "pharo-launcher-mcp", version: $version}}' |
            gh api --method POST repos/Evref-BL/PLexus/dispatches --input -
