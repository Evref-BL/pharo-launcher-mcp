name: Publish to npm

on:
  push:
    branches: [main]
    paths:
      - package.json
      - package-lock.json
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish package
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: npm-publish
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.12.0
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Set up npm for trusted publishing
        run: |
          npm install -g npm@^11.5.1
          npm --version

      - name: Read package metadata
        id: package
        run: |
          echo "name=$(node -p "require('./package.json').name")" >> "$GITHUB_OUTPUT"
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Check package version is not published
        id: version
        run: |
          if npm view "${{ steps.package.outputs.name }}@${{ steps.package.outputs.version }}" version --json > /tmp/npm-version.json 2>/dev/null; then
            echo "::notice::${{ steps.package.outputs.name }}@${{ steps.package.outputs.version }} is already published; skipping publish"
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.version.outputs.published != 'true'
        run: npm ci

      - name: Run checks
        if: steps.version.outputs.published != 'true'
        run: npm run check

      - name: Verify package contents
        if: steps.version.outputs.published != 'true'
        run: npm pack --dry-run

      - name: Publish to npm
        if: steps.version.outputs.published != 'true'
        run: npm publish --access public --tag latest

      # PLexus pins this package exactly, so a release reaches nobody until
      # that pin moves. Tell it, the way MCP and PLexus tell their own
      # consumers, instead of leaving one pin in the stack to be hand-edited.
      - name: Look for the automation credentials
        id: automation
        if: steps.version.outputs.published != 'true'
        env:
          APP_ID: ${{ secrets.DEVNEXUS_AUTOMATION_APP_ID }}
        run: |
          if [ -n "$APP_ID" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::DEVNEXUS_AUTOMATION_APP_ID and DEVNEXUS_AUTOMATION_PRIVATE_KEY are not set, so PLexus was not told about this release. Move its @evref-bl/pharo-launcher-mcp pin by hand."
          fi

      - uses: actions/create-github-app-token@v2
        id: app-token
        if: steps.automation.outputs.available == 'true'
        with:
          app-id: ${{ secrets.DEVNEXUS_AUTOMATION_APP_ID }}
          private-key: ${{ secrets.DEVNEXUS_AUTOMATION_PRIVATE_KEY }}
          owner: Evref-BL
          repositories: PLexus

      - name: Notify released consumers
        if: steps.automation.outputs.available == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          VERSION: ${{ steps.package.outputs.version }}
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          jq -nc --arg version "$VERSION" '{event_type: "component-release", client_payload: {component: "pharo-launcher-mcp", version: $version}}' |
            gh api --method POST repos/Evref-BL/PLexus/dispatches --input -
